<ng-container *ngIf="vm$ | async as vm">
  <section class="page-block">
    <div class="section-head row-between">
      <div>
        <span class="kicker">Documents</span>
        <h2>Pièces justificatives</h2>
      </div>
      <button class="secondary-btn" type="button" (click)="openNewDocument(vm)">Ajouter un document</button>
    </div>

    <div class="table-wrap" *ngIf="vm.documents.length; else emptyDocumentsState">
      <table class="simple-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Type</th>
            <th>Date</th>
            <th>Taille</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let document of vm.documents">
            <td>{{ document.title }}</td>
            <td><span class="tag pdf">{{ document.type }}</span></td>
            <td>{{ document.date | dateTime }}</td>
            <td>{{ document.size }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #emptyDocumentsState>
      <div class="empty-state">
        <p>Aucun document enregistré pour ce projet.</p>
      </div>
    </ng-template>
  </section>
</ng-container>
