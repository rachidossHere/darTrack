spring:
  application:
    name: dartrack-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dartrack}
    username: ${DB_USERNAME:dartrack}
    password: ${DB_PASSWORD:dartrack}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  storage-path: ${APP_STORAGE_PATH:./storage}